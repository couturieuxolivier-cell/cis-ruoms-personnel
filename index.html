<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS Ruoms — Gestion du Personnel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f4ef;color:#1a1a1a;font-size:14px}
header{background:#cc3300;color:#fff;padding:13px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:17px;font-weight:700;flex:1}
.hbadge{font-size:11px;padding:2px 9px;border-radius:5px;background:rgba(255,255,255,.2);color:#fff;font-weight:500}
.container{max-width:1280px;margin:0 auto;padding:18px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.stat{background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #e5e5e0;cursor:default}
.stat-lbl{font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:22px;font-weight:700}
.stat-val.blue{color:#1a5fa8}.stat-val.red{color:#cc3300}.stat-val.orange{color:#e07000}.stat-val.green{color:#1a7a3a}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid #e5e5e0;margin-bottom:14px;gap:2px}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;white-space:nowrap}
.tab.active{color:#cc3300;border-bottom-color:#cc3300}
.tab:hover:not(.active){color:#333}
.panel{display:none}.panel.active{display:block}
/* Toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff}
.toolbar input{width:200px}
/* Table */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #e5e5e0;font-size:12px}
thead{background:#f9f9f7}
th{font-size:10px;font-weight:700;color:#666;text-align:left;padding:9px 10px;border-bottom:1px solid #e5e5e0;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#f0f0ea;color:#333}
th .sort-arrow{margin-left:3px;opacity:.4}
td{padding:8px 10px;border-bottom:1px solid #f0f0ea;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdf8f6;cursor:pointer}
tbody tr.row-inactive{opacity:.5}
tbody tr.row-alert td:first-child{border-left:3px solid #cc3300}
/* Pills */
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.p-grade{background:#ede9ff;color:#4a3aaa}
.p-spv{background:#deeeff;color:#1a5fa8}.p-spp{background:#e0f5e8;color:#1a7a3a}.p-pats{background:#fff0dd;color:#8a5500}
.p-t1{background:#d4f5e8;color:#0a5a35}.p-t2{background:#ede9ff;color:#3a2a9a}.p-t3{background:#fff0dd;color:#7a4500}.p-t4{background:#ffe8e5;color:#8a2020}
.p-nc{background:#eee;color:#777}.p-ok{background:#e0f5e8;color:#1a7a3a}.p-warn{background:#fff0dd;color:#8a5500}.p-danger{background:#ffe8e5;color:#8a2020}
.p-dispo{background:#e0f5e8;color:#1a7a3a}.p-conge{background:#fff0dd;color:#8a5500}.p-indispo{background:#ffe8e5;color:#8a2020}
.red{color:#cc3300}.orange{color:#e07000}.green{color:#1a7a3a}.muted{color:#bbb}
/* Buttons */
.btn{padding:7px 14px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;cursor:pointer;font-weight:500}
.btn:hover{background:#f0f0f0}
.btn-primary{background:#cc3300;color:#fff;border-color:#cc3300}
.btn-primary:hover{background:#b02a00}
.btn-danger{background:#fff0f0;border-color:#ffcccc;color:#cc3300}
.btn-danger:hover{background:#ffe0e0}
.btn-row{display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap}
/* Team grid */
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.team-card{background:#fff;border:1px solid #e5e5e0;border-radius:8px;overflow:hidden}
.team-hdr{padding:10px 14px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.th1{background:#d4f5e8;color:#0a5a35}.th2{background:#ede9ff;color:#3a2a9a}.th3{background:#fff0dd;color:#7a4500}.th4{background:#ffe8e5;color:#8a2020}.thnc{background:#f0f0ec;color:#666}
.tm{padding:8px 14px;font-size:12px;border-top:1px solid #f0f0ea;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.tm:hover{background:#fdf8f6}
.tm-left{flex:1}
.tm-name{font-weight:600}.tm-grade{font-size:10px;color:#999;margin-top:1px}
/* Alert rows */
.alert-row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;background:#fff;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid #e5e5e0;border-left:4px solid #e5e5e0}
.alert-row:hover{background:#fdf8f6}
.alert-row.high{border-left-color:#cc3300}
.alert-row.med{border-left-color:#e07000}
.alert-name{font-weight:600;font-size:13px;flex:1}
.alert-issues{font-size:11px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
/* Drawer */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.overlay.open{display:flex}
.drawer{background:#fff;border-radius:10px;width:600px;max-width:100%;padding:1.5rem;margin-bottom:40px}
.drawer-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
.drawer-hdr h2{font-size:16px;font-weight:700}
.x-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#999;line-height:1;padding:0}
.x-btn:hover{color:#333}
.identity{display:flex;gap:14px;align-items:center;padding-bottom:1rem;border-bottom:1px solid #f0f0ea;margin-bottom:1rem}
.big-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.sec-lbl{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin:1rem 0 7px;padding-bottom:4px;border-bottom:1px solid #f5f5f0}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
.ir-lbl{font-size:10px;color:#aaa;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.ir-val{font-size:13px;font-weight:600;color:#1a1a1a}
/* Formation cards */
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc{background:#f9f9f7;border-radius:7px;padding:9px 12px;border:1px solid #eee;display:flex;flex-direction:column;gap:3px}
.fc-name{font-size:12px;font-weight:700;color:#333}
.fc-date{font-size:11px;color:#999}
.fc-status{font-size:11px;font-weight:600;margin-top:2px}
/* Historique */
.hist-item{padding:8px 12px;background:#f9f9f7;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid #e5e5e0}
.hist-date{font-size:10px;color:#aaa;margin-bottom:2px}
/* Edit form */
.edit-form label{font-size:10px;color:#888;display:block;margin-bottom:2px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.edit-form input,.edit-form select,.edit-form textarea{width:100%;padding:7px 9px;border:1px solid #ddd;border-radius:5px;font-size:13px;font-family:inherit}
.edit-form textarea{resize:vertical;min-height:60px}
.edit-form .ig{gap:10px 16px}
.form-section{margin-bottom:1rem;padding:12px;background:#f9f9f7;border-radius:8px}
.form-section-title{font-size:11px;font-weight:700;color:#cc3300;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
/* No results */
.no-results{text-align:center;padding:40px;color:#aaa;font-size:13px}
/* Print */
@media print{
  header,.tabs,.toolbar,.btn-row,.overlay{display:none!important}
  .container{padding:0}
  .panel{display:block!important}
  table{font-size:11px}
}
/* Dispo indicator */
.dispo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dispo-dot.ok{background:#1a7a3a}.dispo-dot.warn{background:#e07000}.dispo-dot.bad{background:#cc3300}
</style>
</head>

// ── Helpers ────────────────────────────────────────────────────
function toDate(v){if(!v)return null;if(v instanceof Date)return v;return new Date(v);}
function fmt(d){const dt=toDate(d);if(!dt)return '—';return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function monthsAgo(d){const dt=toDate(d);if(!dt)return 999;return(TODAY-dt)/(1000*60*60*24*30.44);}
function monthsUntil(d){const dt=toDate(d);if(!dt)return -999;return(dt-TODAY)/(1000*60*60*24*30.44);}
function inits(a){return((a.nom||'?')[0]+((a.prenom||'?')[0])).toUpperCase();}
function age(naiss){if(!naiss)return null;const p=naiss.split('/');if(p.length!==3)return null;const d=new Date(+p[2],+p[1]-1,+p[0]);return Math.floor((TODAY-d)/31557600000);}
function anciennete(e){if(!e)return null;const p=e.split('/');if(p.length!==3)return null;const d=new Date(+p[2],+p[1]-1,+p[0]);return Math.floor((TODAY-d)/31557600000);}
function parseMyDate(s){if(!s||!s.trim())return null;const p=s.trim().split('/');if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]).toISOString().split('T')[0];return null;}
function avatarColor(nom){const colors=['#1a5fa8','#0a5a35','#7a4500','#8a2020','#3a2a9a','#1a7a3a','#854f0b'];const h=nom.split('').reduce((a,c)=>a+c.charCodeAt(0),0);return colors[h%colors.length];}

// ── Pills ──────────────────────────────────────────────────────
function tPill(t){return t?'<span class="pill p-t'+t+'">Éq.'+t+'</span>':'<span class="pill p-nc">NC</span>';}
function stPill(s){const c={SPV:'p-spv',SPP:'p-spp',PATS:'p-pats'}[s]||'p-nc';return'<span class="pill '+c+'">'+(s||'—')+'</span>';}
function aptCell(a){if(!a)return'<span class="muted">—</span>';const ok=a.toLowerCase().includes('apte')||a.toLowerCase().includes('complet');return'<span class="pill '+(ok?'p-ok':'p-warn')+'">'+a+'</span>';}
function dispoPill(d){const map={dispo:['p-dispo','Disponible'],conge:['p-conge','Congé'],indispo:['p-indispo','Indisponible'],suspendu:['p-danger','Suspendu']};const v=map[d]||['p-nc','—'];return'<span class="pill '+v[0]+'">'+v[1]+'</span>';}
function dispoColor(d){return{dispo:'ok',conge:'warn',indispo:'bad',suspendu:'bad'}[d]||'ok';}

function formCell(lastDate, seuil){
  if(!lastDate)return'<span class="muted">—</span>';
  const m=monthsAgo(lastDate);
  const next=nextEcheance(lastDate,seuil);
  const mu=monthsUntil(next);
  if(m>seuil)return'<span class="red">'+fmt(lastDate)+'</span>';
  if(mu<3)return'<span class="orange">'+fmt(lastDate)+'</span>';
  return'<span class="green">'+fmt(lastDate)+'</span>';
}

// ── Alertes par agent ─────────────────────────────────────────
function getAlerts(a){
  const iss=[];
  if(!a.sap)iss.push({txt:'SAP manquant',cls:'red'});
  else{const m=monthsAgo(a.sap);const mu=monthsUntil(nextEcheance(a.sap,SEUILS.sap));if(m>SEUILS.sap)iss.push({txt:'SAP dépassé ('+fmt(a.sap)+')',cls:'red'});else if(mu<3)iss.push({txt:'SAP à renouveler dans '+Math.round(mu)+'m',cls:'orange'});}
  if(!a.inc)iss.push({txt:'INC manquant',cls:'orange'});
  else{const m=monthsAgo(a.inc);if(m>SEUILS.inc)iss.push({txt:'INC dépassé',cls:'red'});else if(monthsUntil(nextEcheance(a.inc,SEUILS.inc))<3)iss.push({txt:'INC bientôt',cls:'orange'});}
  if(!a.med)iss.push({txt:'VM manquante',cls:'orange'});
  else{const m=monthsAgo(a.med);if(m>SEUILS.med)iss.push({txt:'VM dépassée ('+fmt(a.med)+')',cls:'red'});else if(monthsUntil(nextEcheance(a.med,SEUILS.med))<3)iss.push({txt:'VM dans '+Math.round(monthsUntil(nextEcheance(a.med,SEUILS.med)))+'m',cls:'orange'});}
  if(!a.aptitude)iss.push({txt:'Aptitude non renseignée',cls:'orange'});
  if(a.dispo==='suspendu')iss.push({txt:'Suspendu',cls:'red'});
  if(a.dispo==='indispo')iss.push({txt:'Indisponible',cls:'orange'});
  return iss;
}

// ── Tri ────────────────────────────────────────────────────────
var sortCol='nom', sortDir=1;
function sortBy(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('.sort-arrow').forEach(e=>e.textContent='');
  const el=document.getElementById('sa-'+col);
  if(el)el.textContent=sortDir===1?' ↑':' ↓';
  applyFilters();
}

// ── Filtres & rendu table ─────────────────────────────────────
var view=[];
function applyFilters(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const eq=document.getElementById('feq').value;
  const st=document.getElementById('fst').value;
  const fd=document.getElementById('fdispo').value;
  view=DATA.filter(a=>{
    const t=getTeam(a);
    const mq=!q||(a.nom+' '+a.prenom).toLowerCase().includes(q)||(a.fonctions||'').toLowerCase().includes(q)||(a.qualifs||'').toLowerCase().includes(q);
    return mq&&(!eq||(eq==='0'?t===0:t===+eq))&&(!st||a.statut===st)&&(!fd||a.dispo===fd);
  });
  view.sort((a,b)=>{
    let va=a[sortCol]||'',vb=b[sortCol]||'';
    if(sortCol==='sap'||sortCol==='inc'||sortCol==='med'){va=toDate(a[sortCol])||new Date(0);vb=toDate(b[sortCol])||new Date(0);}
    if(va<vb)return-sortDir;if(va>vb)return sortDir;return 0;
  });
  renderTable();
}
function updateStats(){
  document.getElementById('st-total').textContent=DATA.length;
  document.getElementById('st-dispo').textContent=DATA.filter(a=>a.dispo==='dispo').length;
  document.getElementById('st-indispo').textContent=DATA.filter(a=>a.dispo==='indispo'||a.dispo==='suspendu'||a.dispo==='conge').length;
  document.getElementById('st-alerte').textContent=DATA.filter(a=>getAlerts(a).some(x=>x.cls==='red')).length;
  document.getElementById('st-med').textContent=DATA.filter(a=>!a.med||monthsAgo(a.med)>SEUILS.med).length;
  document.getElementById('st-soon').textContent=DATA.filter(a=>{
    const fields=['sap','inc','med'];const seuils=[SEUILS.sap,SEUILS.inc,SEUILS.med];
    return fields.some((f,i)=>a[f]&&monthsUntil(nextEcheance(a[f],seuils[i]))<3&&monthsAgo(a[f])<seuils[i]);
  }).length;
}
function renderTable(){
  const tb=document.getElementById('tbody');if(!tb)return;
  if(!view.length){tb.innerHTML='<tr><td colspan="11" class="no-results">Aucun agent trouvé</td></tr>';return;}
  tb.innerHTML=view.map(a=>{
    const i=DATA.indexOf(a),t=getTeam(a);
    const inactive=a.dispo==='suspendu';
    const alerts=getAlerts(a);
    const hasRed=alerts.some(x=>x.cls==='red');
    return'<tr onclick="openAgent('+i+')"'+(inactive?' class="row-inactive"':hasRed?' class="row-alert"':'')+'>'+
      '<td style="font-weight:700">'+a.nom+'</td>'+
      '<td>'+a.prenom+'</td>'+
      '<td><span class="pill p-grade">'+a.grade+'</span></td>'+
      '<td>'+stPill(a.statut)+'</td>'+
      '<td>'+tPill(t)+'</td>'+
      '<td><span class="dispo-dot '+dispoColor(a.dispo)+'"></span>'+dispoPill(a.dispo).replace('pill ','pill ').split('Disponible').join('Dispo').split('Indisponible').join('Indispo')+'</td>'+
      '<td class="muted">'+(a.fonctions||'—')+'</td>'+
      '<td>'+formCell(a.sap,SEUILS.sap)+'</td>'+
      '<td>'+formCell(a.inc,SEUILS.inc)+'</td>'+
      '<td>'+formCell(a.med,SEUILS.med)+'</td>'+
      '<td>'+aptCell(a.aptitude)+'</td>'+
    '</tr>';
  }).join('');
}

// ── Équipes ────────────────────────────────────────────────────
function renderTeams(){
  const tg=document.getElementById('tgrid');if(!tg)return;
  let html='';
  for(let t=1;t<=4;t++){
    const members=DATA.filter(a=>getTeam(a)===t);
    const ndispo=members.filter(a=>a.dispo==='dispo').length;
    html+='<div class="team-card"><div class="team-hdr th'+t+'"><span>Équipe '+t+'</span><span style="font-size:11px;opacity:.8">'+ndispo+'/'+members.length+' dispo</span></div>'+
    members.map(m=>'<div class="tm" onclick="openAgent('+DATA.indexOf(m)+')">'+
      '<div class="tm-left"><div class="tm-name"><span class="dispo-dot '+dispoColor(m.dispo)+'"></span>'+m.nom+' '+m.prenom[0]+'.</div>'+
      '<div class="tm-grade">'+m.grade+(m.fonctions?' · '+m.fonctions.split('/')[0].trim():'')+'</div></div>'+
      dispoPill(m.dispo)+'</div>').join('')+'</div>';
  }
  const nc=DATA.filter(a=>getTeam(a)===0);
  if(nc.length)html+='<div class="team-card"><div class="team-hdr thnc"><span>Non affectés</span><span style="font-size:11px;opacity:.7">('+nc.length+')</span></div>'+
    nc.map(m=>'<div class="tm" onclick="openAgent('+DATA.indexOf(m)+')"><div class="tm-left"><div class="tm-name">'+m.nom+' '+m.prenom[0]+'.</div><div class="tm-grade">'+m.grade+'</div></div></div>').join('')+'</div>';
  tg.innerHTML=html;
}

// ── Formations & alertes ───────────────────────────────────────
function renderAlerts(){
  const al=document.getElementById('alist');if(!al)return;
  const rows=[];
  DATA.forEach((a,i)=>{
    const iss=getAlerts(a);
    if(iss.length)rows.push({a,i,iss,prio:iss.some(x=>x.cls==='red')?0:1});
  });
  rows.sort((a,b)=>a.prio-b.prio);
  al.innerHTML='<p style="color:#888;font-size:12px;margin-bottom:12px">'+rows.length+' agent(s) avec au moins une alerte.</p>'+
  rows.map(({a,i,iss})=>'<div class="alert-row '+(iss.some(x=>x.cls==='red')?'high':'med')+'" onclick="openAgent('+i+')">'+
    '<div style="width:36px;height:36px;border-radius:50%;background:'+avatarColor(a.nom)+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0">'+inits(a)+'</div>'+
    '<div style="flex:1"><div class="alert-name">'+a.nom+' '+a.prenom+' <span class="pill p-grade" style="font-size:10px">'+a.grade+'</span> '+tPill(getTeam(a))+'</div>'+
    '<div class="alert-issues">'+iss.map(x=>'<span class="pill '+(x.cls==='red'?'p-danger':'p-warn')+'">'+x.txt+'</span>').join('')+'</div></div></div>').join('');
}

function row2(label,val,color){return'<div style="display:flex;justify-content:space-between"><span style="color:#888">'+label+'</span><span style="font-weight:700'+(color?';color:'+(color==='red'?'#cc3300':color==='orange'?'#e07000':'#1a7a3a'):'')+'">'+(val??'—')+'</span></div>';}

// ── Fiche agent ────────────────────────────────────────────────
function openAgent(i){
  const a=DATA[i],t=getTeam(a),alts=getAlerts(a);
  const color=avatarColor(a.nom);
  function fBlock(label,lastDate,seuil){
    const next=nextEcheance(lastDate,seuil);
    const m=monthsAgo(lastDate);
    const mu=monthsUntil(next);
    let status,cls;
    if(!lastDate){status='⚠ Manquant';cls='red';}
    else if(m>seuil){status='⚠ Dépassé';cls='red';}
    else if(mu<3){status='↗ Dans '+Math.round(mu)+'m';cls='orange';}
    else{status='✓ OK jusqu\'au '+fmt(next);cls='green';}
    return'<div class="fc"><div class="fc-name">'+label+'</div>'+
      '<div class="fc-date">Dernier : '+fmt(lastDate)+(next&&lastDate?' → Prochain : '+fmt(next):'')+'</div>'+
      '<div class="fc-status '+cls+'" style="color:'+(cls==='red'?'#cc3300':cls==='orange'?'#e07000':'#1a7a3a')+'">'+status+'</div></div>';
  }
  let html='<div class="drawer-hdr"><h2>'+a.nom+' '+a.prenom+'</h2><button class="x-btn" onclick="closeOverlay()">×</button></div>';
  html+='<div class="identity">';
  html+='<div class="big-avatar" style="background:'+color+'">'+inits(a)+'</div>';
  html+='<div><div style="font-size:17px;font-weight:700">'+a.nom+' '+a.prenom+'</div>';
  html+='<div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap"><span class="pill p-grade">'+a.grade+'</span>'+stPill(a.statut)+tPill(t)+dispoPill(a.dispo)+(a.aptitude?aptCell(a.aptitude):'')+'</div>';
  if(alts.length)html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">'+alts.map(x=>'<span class="pill '+(x.cls==='red'?'p-danger':'p-warn')+'">'+x.txt+'</span>').join('')+'</div>';
  html+='</div></div>';
  const a_age=age(a.naissance);
  const a_anc=anciennete(a.entree_cis);
  html+='<div class="sec-lbl">Identité & coordonnées</div>';
  html+='<div class="ig">';
  html+='<div><div class="ir-lbl">Date de naissance</div><div class="ir-val">'+(a.naissance||'—')+(a_age?' ('+a_age+' ans)':'')+'</div></div>';
  html+='<div><div class="ir-lbl">Entrée au CIS</div><div class="ir-val">'+(a.entree_cis||'—')+(a_anc?' ('+a_anc+' an'+(a_anc>1?'s':'')+')':'')+'</div></div>';
  html+='<div><div class="ir-lbl">Téléphone</div><div class="ir-val">'+(a.tel||'—')+'</div></div>';
  html+='<div><div class="ir-lbl">Email</div><div class="ir-val" style="font-size:11px">'+(a.email||'—')+'</div></div>';
  html+='<div style="grid-column:span 2"><div class="ir-lbl">Adresse</div><div class="ir-val">'+(a.adresse||'—')+'</div></div>';
  html+='</div>';
  html+='<div class="sec-lbl">Missions & qualifications</div>';
  html+='<div class="ig">';
  html+='<div><div class="ir-lbl">Fonctions</div><div class="ir-val">'+(a.fonctions||'—')+'</div></div>';
  html+='<div><div class="ir-lbl">Qualifications</div><div class="ir-val">'+(a.qualifs||'—')+'</div></div>';
  html+='<div><div class="ir-lbl">Matricule</div><div class="ir-val">'+(a.mat||'—')+'</div></div>';
  html+='<div><div class="ir-lbl">BIP</div><div class="ir-val">'+(a.bip||'—')+'</div></div>';
  html+='</div>';
  html+='<div class="sec-lbl">Permis</div>';
  html+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
  html+='<span class="pill '+(a.permB?'p-ok':'p-nc')+'">B: '+(a.permB?'OUI':'NON')+'</span>';
  html+='<span class="pill '+(a.permC?'p-ok':'p-nc')+'">C: '+(a.permC?'OUI':'NON')+'</span>';
  html+='<span class="pill '+(a.permCE?'p-ok':'p-nc')+'">CE: '+(a.permCE?'OUI':'NON')+'</span>';
  if(a.taille)html+='<span class="pill p-nc">EPI: '+a.taille+'</span>';
  html+='</div>';
  html+='<div class="sec-lbl">Formations & échéances</div>';
  html+='<div class="fc-grid">'+fBlock('Recyclage SAP',a.sap,SEUILS.sap)+fBlock('Recyclage INC',a.inc,SEUILS.inc)+fBlock('Feux de forêt (FDF)',a.fdf,SEUILS.fdf)+fBlock('Visite médicale',a.med,SEUILS.med)+'</div>';
  if(a.contact)html+='<div class="sec-lbl">Contact d\'urgence</div><div class="ig"><div><div class="ir-lbl">Personne</div><div class="ir-val">'+a.contact+'</div></div><div><div class="ir-lbl">Téléphone</div><div class="ir-val">'+a.ctTel+'</div></div></div>';
  if(a.notes)html+='<div class="sec-lbl">Notes</div><p style="font-size:13px;color:#555;background:#f9f9f7;padding:10px;border-radius:6px">'+a.notes+'</p>';
  // Historique
  html+='<div class="sec-lbl">Historique</div>';
  if(a.historique&&a.historique.length){
    html+=a.historique.slice().reverse().map(h=>'<div class="hist-item"><div class="hist-date">'+h.date+'</div>'+h.texte+'</div>').join('');
  }else{html+='<p style="font-size:12px;color:#aaa;margin-bottom:8px">Aucune entrée.</p>';}
  html+='<div style="display:flex;gap:8px;margin-top:8px"><input id="newHistTxt" type="text" placeholder="Ajouter une note d\'historique…" style="flex:1;padding:7px 9px;border:1px solid #ddd;border-radius:5px;font-size:12px"><button class="btn" onclick="addHistorique('+i+')" style="white-space:nowrap;font-size:12px">+ Ajouter</button></div>';
  html+='<div class="btn-row"><button class="btn btn-primary" onclick="openEdit('+i+')">✏ Modifier</button><button class="btn btn-danger" onclick="deleteAgent('+i+')">🗑 Supprimer</button><button class="btn" onclick="closeOverlay()">Fermer</button></div>';
  document.getElementById('drawer').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}

function addHistorique(i){
  const txt=document.getElementById('newHistTxt').value.trim();
  if(!txt)return;
  if(!DATA[i].historique)DATA[i].historique=[];
  DATA[i].historique.push({date:TODAY.toLocaleDateString('fr-FR'),texte:txt});
  cloudSave();
  openAgent(i);
}

// ── Formulaire édition ─────────────────────────────────────────
function openEdit(i){
  const a=DATA[i],t=getTeam(a);
  const gOpts=['Ltn','ADC','ADJ','SCH','SGT','CCH','CPL','1CL','SAP','IPR','ISP'].map(g=>'<option'+(a.grade===g?' selected':'')+'>'+g+'</option>').join('');
  const sOpts=['SPV','SPP','PATS','SAISONNIER'].map(s=>'<option'+(a.statut===s?' selected':'')+'>'+s+'</option>').join('');
  const tOpts='<option value="0"'+(t===0?' selected':'')+'>Non affecté</option>'+[1,2,3,4].map(n=>'<option value="'+n+'"'+(t===n?' selected':'')+'>Équipe '+n+'</option>').join('');
  const dOpts=['dispo','conge','indispo','suspendu'].map(d=>'<option value="'+d+'"'+(a.dispo===d?' selected':'')+'>'+{dispo:'Disponible',conge:'En congé',indispo:'Indisponible',suspendu:'Suspendu'}[d]+'</option>').join('');

  function fi(id,label,val,span){return'<div'+(span?' style="grid-column:span '+span+'"':'')+'><label>'+label+'</label><input id="'+id+'" value="'+(val||'')+'"></div>';}
  function fd2(id,label,val){return'<div><label>'+label+' (JJ/MM/AAAA)</label><input id="'+id+'" value="'+(val?fmt(val):'')+'"></div>';}
  function cb(id,label,val){return'<label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer"><input type="checkbox" id="'+id+'"'+(val?' checked':'')+' style="width:auto">'+label+'</label>';}

  let html='<div class="drawer-hdr"><h2>Modifier — '+a.nom+' '+a.prenom+'</h2><button class="x-btn" onclick="closeOverlay()">×</button></div>';

  html+='<div class="form-section"><div class="form-section-title">Identité</div><div class="ig">';
  html+=fi('en','Nom',a.nom)+fi('ep','Prénom',a.prenom)+fi('enaiss','Date de naissance',a.naissance)+fi('ecis','Entrée au CIS',a.entree_cis);

  html+='<div><label>Statut</label><select id="es">'+sOpts+'</select></div>';
  html+='<div><label>Équipe</label><select id="et">'+tOpts+'</select></div>';
  html+='<div><label>Disponibilité</label><select id="edispo">'+dOpts+'</select></div>';
  html+='</div></div>';
  html+='<div class="form-section"><div class="form-section-title">Coordonnées</div><div class="ig">';
  html+=fi('etl','Téléphone',a.tel)+fi('eem','Email',a.email);
  html+=fi('eadr','Adresse',a.adresse,2);
  html+='</div></div>';
  html+='<div class="form-section"><div class="form-section-title">Missions</div><div class="ig">';
  html+=fi('ef','Fonctions',a.fonctions)+fi('eq2','Qualifications',a.qualifs);
  html+=fi('emat','Matricule',a.mat)+fi('ebip','BIP',a.bip)+fi('etaille','Taille EPI',a.taille)+fi('ea','Aptitude',a.aptitude);
  html+='</div></div>';
  html+='<div class="form-section"><div class="form-section-title">Formations</div><div class="ig">';
  html+=fd2('esap','Dernier SAP',a.sap)+fd2('einc','Dernier INC',a.inc)+fd2('efdf','Dernier FDF',a.fdf)+fd2('emed','Dernière visite méd.',a.med);
  html+='</div></div>';
  html+='<div class="form-section"><div class="form-section-title">Permis</div><div style="display:flex;gap:16px;flex-wrap:wrap">';
  html+=cb('epb','Permis B',a.permB)+cb('epc','Permis C',a.permC)+cb('epce','Permis CE',a.permCE);
  html+='</div></div>';
  html+='<div class="form-section"><div class="form-section-title">Contact d\'urgence</div><div class="ig">';

  a.prenom=document.getElementById('ep').value.trim();
  a.naissance=document.getElementById('enaiss').value.trim();
  a.entree_cis=document.getElementById('ecis').value.trim();
  a.grade=document.getElementById('eg').value;
  a.statut=document.getElementById('es').value;
  a.dispo=document.getElementById('edispo').value;
  a.aptitude=document.getElementById('ea').value.trim();
  a.tel=document.getElementById('etl').value.trim();
  a.email=document.getElementById('eem').value.trim();
  a.adresse=document.getElementById('eadr').value.trim();
  a.fonctions=document.getElementById('ef').value.trim();
  a.qualifs=document.getElementById('eq2').value.trim();
  a.sap=parseMyDate(document.getElementById('esap').value);
  a.inc=parseMyDate(document.getElementById('einc').value);
  a.fdf=parseMyDate(document.getElementById('efdf').value);
  a.med=parseMyDate(document.getElementById('emed').value);
  a.mat=document.getElementById('emat').value.trim();
  a.bip=document.getElementById('ebip').value.trim();
  a.taille=document.getElementById('etaille').value.trim();
  a.contact=document.getElementById('ect').value.trim();
  a.ctTel=document.getElementById('ectl').value.trim();
  a.notes=document.getElementById('enotes').value.trim();
  a.permB=document.getElementById('epb').checked;
  a.permC=document.getElementById('epc').checked;
  a.permCE=document.getElementById('epce').checked;

}

function openNew(){
  DATA.push({nom:'NOUVEAU',prenom:'Agent',grade:'1CL',statut:'SPV',naissance:'',fonctions:'',qualifs:'',sap:null,inc:null,fdf:null,cod:null,med:null,aptitude:'',tel:'',email:'',adresse:'',mat:'',contact:'',ctTel:'',permB:true,permC:false,permCE:false,bip:'',taille:'',entree_cis:'',dispo:'dispo',notes:'',historique:[]});
  openEdit(DATA.length-1);
  document.getElementById('overlay').classList.add('open');
}

function deleteAgent(i){
  const a=DATA[i];
  if(!confirm('Supprimer '+a.nom+' '+a.prenom+' ?\nCette action est irréversible.'))return;
  const n=a.nom.toUpperCase();
  for(let t=1;t<=4;t++)TEAMS[t]=TEAMS[t].filter(x=>x!==n);
  DATA.splice(i,1);
  closeOverlay();
  view=DATA.slice();applyFilters();updateStats();
  cloudSave();
}

function closeOverlay(){document.getElementById('overlay').classList.remove('open');}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeOverlay();}

function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['liste','equipes','formations','tableau'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='equipes')renderTeams();
  if(name==='formations')renderAlerts();
  if(name==='tableau')renderDashboard();
}

// ── JSONBin ────────────────────────────────────────────────────
var BIN_ID=null;
function setSyncStatus(s,m){const el=document.getElementById('syncStatus');if(!el)return;el.textContent=m;el.style.background={ok:'rgba(26,122,58,.5)',saving:'rgba(224,112,0,.5)',err:'rgba(204,51,0,.5)',loading:'rgba(255,255,255,.2)'}[s]||'rgba(255,255,255,.2)';}

function serialise(){
  return{data:DATA.map(a=>{const o=Object.assign({},a);o.historique=a.historique||[];return o;}),teams:TEAMS};
}
function deserialise(obj){
  DATA=(obj.data||[]).map(a=>{if(!a.historique)a.historique=[];if(!a.dispo)a.dispo='dispo';if(!a.fdf)a.fdf=null;return a;});
  if(obj.teams)for(const k in obj.teams)TEAMS[k]=obj.teams[k];
}

async function cloudSave(){
  setSyncStatus('saving','⟳ Sauvegarde…');
  try{
    if(!BIN_ID){
      const r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_API_KEY,'X-Bin-Name':'CIS-Ruoms-v3','X-Bin-Private':'true'},body:JSON.stringify(serialise())});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();BIN_ID=j.metadata.id;localStorage.setItem(JSONBIN_ID_KEY,BIN_ID);
    }else{
      const r=await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID,{method:'PUT',mode:'cors',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_API_KEY},body:JSON.stringify(serialise())});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    setSyncStatus('ok','✓ Sauvegardé');
  }catch(e){setSyncStatus('err','⚠ Erreur: '+e.message.substring(0,30));console.error(e);}
}

async function cloudLoad(){
  BIN_ID=localStorage.getItem(JSONBIN_ID_KEY)||null;
  if(!BIN_ID)return;
  try{
    setSyncStatus('loading','⟳ Chargement…');
    const r=await fetch('https://api.jsonbin.io/v3/b/'+BIN_ID+'/latest',{mode:'cors',headers:{'X-Master-Key':JSONBIN_API_KEY}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.record)deserialise(j.record);
    setSyncStatus('ok','✓ Synchronisé');
  }catch(e){setSyncStatus('err','⚠ Hors ligne');console.error(e);}
}

// ── Init ───────────────────────────────────────────────────────
(async function(){
  await cloudLoad();
  view=DATA.slice();
  updateStats();
  renderTable();
})();
