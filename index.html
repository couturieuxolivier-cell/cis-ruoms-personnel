  .btn{padding:7px 14px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;cursor:pointer}

  .btn-primary{background:#cc3300;color:#fff;border-color:#cc3300}
  .btn-primary:hover{background:#b02a00}
  .tabs{display:flex;gap:0;border-bottom:2px solid #e5e5e0;margin-bottom:16px}
  .tab{padding:9px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500}
  .tab.active{color:#cc3300;border-bottom-color:#cc3300}
  .tab:hover:not(.active){color:#333}
  .panel{display:none}.panel.active{display:block}

  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fdf8f6;cursor:pointer}

function parseMyDate(s) {
  if (!s || !s.trim()) return null;
  const p = s.trim().split('/');
  if (p.length === 3) return new Date(+p[2], +p[1] - 1, +p[0]);
  return null;
}
function fmt(d) {
  if (!d) return '—';
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function monthsAgo(d) {
  if (!d) return 999;
  return (TODAY - d) / (1000 * 60 * 60 * 24 * 30.44);
}
function inits(a) {
  return ((a.nom || '?')[0] + ((a.prenom || '?')[0])).toUpperCase();
}

function getTeam(a) {
  const n = a.nom.toUpperCase();
  const np = (a.nom + ' ' + (a.prenom || '')[0]).toUpperCase();
  for (const [t, members] of Object.entries(TEAMS)) {
    for (const m of members) {
      if (m === np || m === n) return +t;
    }
  }
  return 0;
}

function setTeam(nom, prenom, t) {
  const n = nom.toUpperCase();
  const np = (nom + ' ' + (prenom||'')[0]).toUpperCase();
  for (let i = 1; i <= 4; i++) {
    TEAMS[i] = TEAMS[i].filter(x => x !== n && x !== np);

}

function tPill(t) {
  if (!t) return '<span class="pill p-nc">NC</span>';
  return '<span class="pill p-t' + t + '">Éq.' + t + '</span>';
}
function stPill(s) {
  var c = {SPV:'p-spv',SPP:'p-spp',PATS:'p-pats'}[s] || 'p-nc';
  return '<span class="pill ' + c + '">' + (s||'—') + '</span>';
}
function sapCell(d) {
  if (!d) return '<span class="muted">—</span>';
  var m = monthsAgo(d);
  var cls = m > 24 ? 'red' : m > 18 ? 'orange' : 'green';
  return '<span class="' + cls + '">' + fmt(d) + '</span>';
}
function medCell(d) {
  if (!d) return '<span class="muted">—</span>';
  var m = monthsAgo(d);
  var cls = m > 12 ? 'red' : m > 9 ? 'orange' : 'green';
  return '<span class="' + cls + '">' + fmt(d) + '</span>';
}
function aptCell(a) {
  if (!a) return '<span class="muted">—</span>';
  var c = (a.toLowerCase().indexOf('apte') >= 0 || a.toLowerCase().indexOf('complet') >= 0) ? 'p-ok' : 'p-warn';
  return '<span class="pill ' + c + '">' + a + '</span>';
}

var view = DATA.slice();

function applyFilters() {
  var q = (document.getElementById('srch').value || '').toLowerCase();
  var eq = document.getElementById('feq').value;
  var st = document.getElementById('fst').value;
  view = DATA.filter(function(a) {
    var t = getTeam(a);
    var mq = !q || (a.nom + ' ' + a.prenom).toLowerCase().indexOf(q) >= 0 || (a.grade||'').toLowerCase().indexOf(q) >= 0 || (a.fonctions||'').toLowerCase().indexOf(q) >= 0;
    var meq = !eq || (eq === '0' ? t === 0 : t === +eq);
    var mst = !st || a.statut === st;
    return mq && meq && mst;
  });
  renderTable();
}

function updateStats() {
  document.getElementById('st-total').textContent = DATA.length;
  document.getElementById('st-spv').textContent = DATA.filter(function(a){return a.statut==='SPV';}).length;
  document.getElementById('st-alerte').textContent = DATA.filter(function(a){return !a.sap || monthsAgo(a.sap)>18 || !a.inc || monthsAgo(a.inc)>18;}).length;
  document.getElementById('st-med').textContent = DATA.filter(function(a){return !a.med || monthsAgo(a.med)>9;}).length;
}

function renderTable() {
  var tb = document.getElementById('tbody');
  if (!tb) return;
  if (view.length === 0) {
    tb.innerHTML = '<tr><td colspan="9" class="no-results">Aucun agent trouvé</td></tr>';
    return;
  }
  var html = '';
  for (var vi = 0; vi < view.length; vi++) {
    var a = view[vi];
    var i = DATA.indexOf(a);
    var t = getTeam(a);
    html += '<tr onclick="openAgent(' + i + ')">';
    html += '<td style="font-weight:600">' + a.nom + '</td>';
    html += '<td>' + a.prenom + '</td>';
    html += '<td><span class="pill p-grade">' + a.grade + '</span></td>';
    html += '<td>' + stPill(a.statut) + '</td>';
    html += '<td>' + tPill(t) + '</td>';
    html += '<td style="color:#888">' + (a.fonctions || '—') + '</td>';
    html += '<td>' + sapCell(a.sap) + '</td>';
    html += '<td>' + medCell(a.med) + '</td>';
    html += '<td>' + aptCell(a.aptitude) + '</td>';
    html += '</tr>';
  }
  tb.innerHTML = html;
}

function renderTeams() {
  var tg = document.getElementById('tgrid');
  if (!tg) return;
  var names = {1:'Équipe 1',2:'Équipe 2',3:'Équipe 3',4:'Équipe 4'};
  var html = '';
  for (var t = 1; t <= 4; t++) {
    var members = DATA.filter(function(a){return getTeam(a)===t;});
    html += '<div class="team-card"><div class="team-hdr th' + t + '">' + names[t] + ' <span style="font-size:11px;opacity:.7">(' + members.length + ')</span></div>';
    for (var m = 0; m < members.length; m++) {
      var idx = DATA.indexOf(members[m]);
      html += '<div class="tm" onclick="openAgent(' + idx + ')"><div style="font-weight:600">' + members[m].nom + ' ' + members[m].prenom[0] + '.</div><div class="tm-grade">' + members[m].grade + (members[m].fonctions ? ' · ' + members[m].fonctions.split('/')[0].trim() : '') + '</div></div>';
    }
    html += '</div>';
  }
  var nc = DATA.filter(function(a){return getTeam(a)===0;});
  if (nc.length) {
    html += '<div class="team-card"><div class="team-hdr thnc">Non affectés (' + nc.length + ')</div>';
    for (var m = 0; m < nc.length; m++) {
      var idx = DATA.indexOf(nc[m]);
      html += '<div class="tm" onclick="openAgent(' + idx + ')"><div style="font-weight:600">' + nc[m].nom + ' ' + nc[m].prenom[0] + '.</div><div class="tm-grade">' + nc[m].grade + '</div></div>';
    }
    html += '</div>';
  }
  tg.innerHTML = html;
}

function renderAlerts() {
  var al = document.getElementById('alist');
  if (!al) return;
  var rows = [];
  for (var i = 0; i < DATA.length; i++) {
    var a = DATA[i];
    var issues = [];
    if (!a.sap) issues.push({txt:'SAP manquant',cls:'red'});
    else if (monthsAgo(a.sap) > 24) issues.push({txt:'SAP dépassé (' + fmt(a.sap) + ')',cls:'red'});
    else if (monthsAgo(a.sap) > 18) issues.push({txt:'SAP à planifier (' + fmt(a.sap) + ')',cls:'orange'});
    if (!a.inc) issues.push({txt:'INC manquant',cls:'orange'});
    else if (monthsAgo(a.inc) > 18) issues.push({txt:'INC dépassé',cls:'red'});
    if (!a.med) issues.push({txt:'Visite méd. manquante',cls:'orange'});
    else if (monthsAgo(a.med) > 12) issues.push({txt:'VM dépassée (' + fmt(a.med) + ')',cls:'red'});
    else if (monthsAgo(a.med) > 9) issues.push({txt:'VM bientôt (' + fmt(a.med) + ')',cls:'orange'});
    if (!a.aptitude) issues.push({txt:'Aptitude non renseignée',cls:'orange'});
    if (a.notes && (a.notes.toLowerCase().indexOf('suspension') >= 0 || a.notes.toLowerCase().indexOf('demission') >= 0))
      issues.push({txt:a.notes,cls:'red'});
    if (issues.length) rows.push({a:a,i:i,issues:issues,prio:issues.some(function(x){return x.cls==='red';})?0:1});
  }
  rows.sort(function(a,b){return a.prio-b.prio;});
  var html = '';
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    var issHtml = row.issues.map(function(x){return '<span class="' + x.cls + '">' + x.txt + '</span>';}).join(' · ');
    html += '<div class="alert-row" onclick="openAgent(' + row.i + ')">';
    html += '<div class="avatar">' + inits(row.a) + '</div>';
    html += '<div class="alert-name">' + row.a.nom + ' ' + row.a.prenom + ' <span class="pill p-grade" style="font-size:10px">' + row.a.grade + '</span></div>';
    html += '<div style="font-size:12px">' + issHtml + '</div>';
    html += '</div>';
  }
  al.innerHTML = html || '<p style="color:#aaa">Aucune alerte.</p>';
}

  a.ctTel = document.getElementById('ectl').value.trim();
  a.notes = document.getElementById('enotes').value.trim();
  var nt = +document.getElementById('et').value;
  setTeam(a.nom, a.prenom, nt);
  cloudSave();
  applyFilters();
  updateStats();
  openAgent(i);
}

function openNew() {
  DATA.push({nom:'NOUVEAU',prenom:'Agent',grade:'1CL',statut:'SPV',fonctions:'',qualifs:'',sap:null,inc:null,med:null,aptitude:'',tel:'',email:'',adresse:'',mat:'',contact:'',ctTel:'',permB:true,permC:false,permCE:false,bip:'',notes:''});
  openEdit(DATA.length - 1);
  document.getElementById('overlay').classList.add('open');
}

function closeOverlay() { document.getElementById('overlay').classList.remove('open'); }
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeOverlay(); }

function showTab(name) {
  var names = ['liste','equipes','formations'];
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', names[i]===name); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('panel-'+name).classList.add('active');
  if (name === 'equipes') renderTeams();
  if (name === 'formations') renderAlerts();
}

// ── JSONBin Cloud Storage ──────────────────────────────────────
var JSONBIN_API_KEY = '$2a$10$e1D6odQKIuybtKMHq0d0EeRDHy5p4TzU9sC3Zoj/S.lO7J0tyCWYK';
var JSONBIN_BIN_ID  = null; // sera créé automatiquement au premier lancement
var JSONBIN_ID_KEY  = 'cis_ruoms_bin_id'; // on stocke l'ID du bin en localStorage

function setSyncStatus(state, msg) {
  var el = document.getElementById('syncStatus');
  if (!el) return;
  var colors = {ok:'#1a7a3a', saving:'#e07000', err:'#cc3300', loading:'#1a5fa8'};
  el.textContent = msg;
  el.style.background = colors[state] || '#888';
}

function serialise() {
  return {
    data: DATA.map(function(a) {
      var o = Object.assign({}, a);
      o.sap = a.sap ? a.sap.toISOString() : null;
      o.inc = a.inc ? a.inc.toISOString() : null;
      o.med = a.med ? a.med.toISOString() : null;
      return o;
    }),
    teams: TEAMS
  };
}

function deserialise(obj) {
  DATA = (obj.data || []).map(function(a) {
    a.sap = a.sap ? new Date(a.sap) : null;
    a.inc = a.inc ? new Date(a.inc) : null;
    a.med = a.med ? new Date(a.med) : null;
    return a;
  });
  if (obj.teams) {
    for (var k in obj.teams) TEAMS[k] = obj.teams[k];
  }
}

async function cloudSave() {
  setSyncStatus('saving', '⟳ Sauvegarde...');
  var payload = serialise();
  try {
    if (!JSONBIN_BIN_ID) {
      // Premier lancement : créer le bin
      var res = await fetch('https://api.jsonbin.io/v3/b', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY,
          'X-Bin-Name': 'CIS-Ruoms-Personnel',
          'X-Bin-Private': 'true'
        },
        body: JSON.stringify(payload)
      });
      var json = await res.json();
      JSONBIN_BIN_ID = json.metadata.id;
      localStorage.setItem(JSONBIN_ID_KEY, JSONBIN_BIN_ID);
    } else {
      // Mise à jour du bin existant
      await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(payload)
      });
    }
    setSyncStatus('ok', '✓ Sauvegardé en ligne');
  } catch(e) {
    setSyncStatus('err', '⚠ Erreur sauvegarde');
    console.error(e);
  }
}

async function cloudLoad() {
  // Récupérer l'ID du bin depuis localStorage
  JSONBIN_BIN_ID = localStorage.getItem(JSONBIN_ID_KEY) || null;
  if (!JSONBIN_BIN_ID) {
    // Chercher un bin existant par nom
    try {
      var res = await fetch('https://api.jsonbin.io/v3/b?page=1&perPage=10', {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      // pas d'endpoint liste, on part des données par défaut
    } catch(e) {}
    return; // Utilisera les données par défaut
  }
  try {
    setSyncStatus('loading', '⟳ Chargement...');
    var res = await fetch('https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    var json = await res.json();
    if (json.record) {
      deserialise(json.record);
    }
    setSyncStatus('ok', '✓ Synchronisé');
  } catch(e) {
    setSyncStatus('err', '⚠ Hors ligne - données locales');
    console.error(e);
  }
}

// ── Init ───────────────────────────────────────────────────────
(async function init() {
  await cloudLoad();
  view = DATA.slice();
  updateStats();
  renderTable();
})();
</script>
